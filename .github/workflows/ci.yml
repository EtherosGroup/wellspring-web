name: ci

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: 安装插件依赖（严格按 lockfile）
              run: npm ci --no-audit --no-fund

            - name: 安装前端依赖（严格按 lockfile）
              run: npm --prefix frontend ci --no-audit --no-fund

            - name: 插件类型检查
              run: npm run typecheck

            - name: 前端类型检查
              run: npm --prefix frontend run typecheck

            - name: 构建前端并核对提交的 www 产物
              run: |
                  set -euo pipefail
                  npm run build:ui
                  if ! git diff --exit-code -- www; then
                    echo "www/ 与前端源码不一致：本地跑 npm run build:ui 后提交产物。"
                    exit 1
                  fi

            - name: 测试
              run: npm test

            - name: 打包插件 zip
              run: npm run build:zip

            - name: 冒烟：zip 里必须有清单、入口、后端源码与前端产物
              run: |
                  set -euo pipefail
                  unzip -Z1 release/*.zip > /tmp/zip.txt
                  cat /tmp/zip.txt
                  grep -qx 'package.json' /tmp/zip.txt
                  grep -qx 'index.ts' /tmp/zip.txt
                  grep -qx 'src/static.ts' /tmp/zip.txt
                  grep -qx 'src/session.ts' /tmp/zip.txt
                  grep -qx 'src/sso-client.ts' /tmp/zip.txt
                  grep -qx 'src/chat-store.ts' /tmp/zip.txt
                  grep -qx 'src/router.ts' /tmp/zip.txt
                  grep -qx 'www/index.html' /tmp/zip.txt
                  grep -Eq '^www/assets/app-.*\.js$' /tmp/zip.txt
                  grep -Eq '^www/assets/style-.*\.css$' /tmp/zip.txt
