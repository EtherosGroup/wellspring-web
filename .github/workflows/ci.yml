name: ci

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 12.14.0

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖（严格按 lockfile）
              run: pnpm install --frozen-lockfile

            - name: 类型检查
              run: pnpm run typecheck

            - name: 测试
              run: pnpm test

            - name: 打包插件 zip
              run: pnpm run build:zip

            - name: 冒烟：zip 里必须有清单、入口与网关连接/静态服务源码
              run: |
                  set -euo pipefail
                  unzip -Z1 release/*.zip > /tmp/zip.txt
                  cat /tmp/zip.txt
                  grep -qx 'package.json' /tmp/zip.txt
                  grep -qx 'index.ts' /tmp/zip.txt
                  grep -qx 'src/config.ts' /tmp/zip.txt
                  grep -qx 'src/assets.ts' /tmp/zip.txt
                  grep -qx 'src/static.ts' /tmp/zip.txt
                  grep -qx 'src/session.ts' /tmp/zip.txt
                  grep -qx 'src/sso-client.ts' /tmp/zip.txt
